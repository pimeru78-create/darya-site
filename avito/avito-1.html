<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="stylesheet" href="avito.css">
<style>
  .cover-grid{flex:1; display:grid; grid-template-columns: 1.05fr 0.95fr; gap:36px; align-items:center;}
  .photo-frame{width:100%; aspect-ratio:1/1.12; border-radius:28px; overflow:hidden; border:1px solid var(--line); box-shadow:0 0 90px rgba(34,197,94,0.32);}
  .photo-frame img{width:100%; height:100%; object-fit:cover;}
  .discount-badge{display:inline-flex; flex-direction:column; align-items:flex-start; gap:2px; background:var(--grad); color:#04170a; padding:16px 26px; border-radius:18px; margin-bottom:22px; box-shadow:0 0 40px rgba(74,222,128,0.5);}
  .discount-badge .big{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:44px; line-height:1;}
  .discount-badge .small{font-size:20px; font-weight:700;}
  .cover-h1{font-size:56px; font-weight:700; line-height:1.1; margin:0 0 14px; letter-spacing:-0.01em;}
  .cover-role{font-size:29px; font-weight:700; color:var(--muted); margin-bottom:20px; font-family:'Space Grotesk',sans-serif;}
  .cover-desc{color:var(--muted); font-size:23px; font-weight:700; line-height:1.5; max-width:460px;}
</style></head>
<body>
<div class="slide">
  <div class="blobs"><div class="blob blob1"></div><div class="blob blob2"></div></div>
  <div class="brand"><div class="brand-name"><span class="dot"></span>Дарья Чуручанова</div><div class="pagenum">1/10</div></div>
  <div class="content">
    <div class="cover-grid">
      <div>
        <div class="discount-badge"><span class="big">-10%</span><span class="small">на первую разработку</span></div>
        <h1 class="cover-h1">Дарья Чуручанова</h1>
        <div class="cover-role">Сайты, боты и AI-агенты <span class="grad-text">с ИИ</span></div>
        <p class="cover-desc">Частный мастер, работаю быстро — от лендинга до AI-агента. Первая консультация бесплатно.</p>
      </div>
      <div class="photo-frame"><img src="darya.jpg" alt="Дарья Чуручанова"></div>
    </div>
  </div>
</div>
</body></html>
