<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="stylesheet" href="avito.css">
<style>
  .h2{font-size:48px; font-weight:700; margin:14px 0 8px; text-align:center;}
  .lead{color:var(--muted); font-size:24px; font-weight:700; margin-bottom:20px; text-align:center;}
  .stage{flex:1; position:relative; display:flex; align-items:center; justify-content:center;}
  .phone{width:340px; height:760px; background:#0a0f0b; border:6px solid #1a2b1e; border-radius:44px; box-shadow:0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(34,197,94,0.25); overflow:hidden; position:relative; z-index:2;}
  .pnotch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:130px; height:22px; background:#1a2b1e; border-radius:0 0 16px 16px; z-index:5;}
  .phead{background:#0f1a12; padding:30px 20px 14px; border-bottom:1px solid rgba(74,222,128,0.15); display:flex; align-items:center; gap:10px;}
  .phead .av{width:34px; height:34px; border-radius:50%; background:var(--grad);}
  .phead .t1{color:#fff; font-weight:700; font-size:19px; font-family:'Space Grotesk',sans-serif;}
  .phead .t2{color:var(--green2); font-size:15px; font-weight:700;}
  .pbody{padding:16px; display:flex; flex-direction:column; gap:9px;}
  .pmsg{font-size:17px; font-weight:700; padding:10px 14px; border-radius:14px; max-width:84%; line-height:1.35;}
  .pmsg.bot{background:rgba(74,222,128,0.16); color:#d7fbe3; border-bottom-left-radius:3px; align-self:flex-start;}
  .pmsg.user{background:rgba(255,255,255,0.1); color:#eafbee; border-bottom-right-radius:3px; align-self:flex-end;}
  .pbtns{display:flex; flex-direction:column; gap:7px; margin-top:2px;}
  .pbtns button{background:rgba(74,222,128,0.1); border:1px solid rgba(74,222,128,0.3); color:#bff5cf; font-size:17px; font-weight:700; padding:10px; border-radius:10px; text-align:left; font-family:Inter,Arial,sans-serif;}
  .float-chip{position:absolute; z-index:3; display:flex; align-items:center; gap:11px; background:rgba(6,12,7,0.94); border:1px solid var(--line); border-radius:14px; padding:13px 18px; box-shadow:0 10px 30px rgba(0,0,0,0.4);}
  .float-chip .ic-badge{width:44px; height:44px; border-radius:11px;}
  .float-chip .ic-badge .ic{width:21px; height:21px;}
  .float-chip span.t{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;}
  .chip-a{top:100px; left:20px;}
  .chip-b{top:220px; right:0px;}
  .chip-c{bottom:180px; left:0px;}
  .chip-d{bottom:60px; right:20px;}
</style></head>
<body>
<div class="slide">
  <div class="blobs"><div class="blob blob1"></div><div class="blob blob2"></div></div>
  <div class="brand"><div class="brand-name"><span class="dot"></span>Дарья Чуручанова</div><div class="pagenum">4/10</div></div>
  <svg style="display:none">
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 12h4l2 3h4l2-3h4"/><path d="M5.5 5h13l2 7v6a1.5 1.5 0 01-1.5 1.5h-14A1.5 1.5 0 013.5 18v-6l2-7z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0112 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10z"/><path d="M10 19a2 2 0 004 0"/></symbol>
  </svg>
  <div class="content">
    <h2 class="h2">Бот для вашего бизнеса</h2>
    <p class="lead">Салон, мастерская, консультации — любая запись и приём заявок</p>
    <div class="stage">
      <div class="float-chip chip-a"><div class="ic-badge badge-1"><svg class="ic"><use href="#i-inbox"/></svg></div><span class="t">Приём заявок</span></div>
      <div class="float-chip chip-b"><div class="ic-badge badge-2"><svg class="ic"><use href="#i-clock"/></svg></div><span class="t">Работает 24/7</span></div>
      <div class="float-chip chip-c"><div class="ic-badge badge-3"><svg class="ic"><use href="#i-card"/></svg></div><span class="t">Приём оплаты</span></div>
      <div class="float-chip chip-d"><div class="ic-badge badge-1"><svg class="ic"><use href="#i-bell"/></svg></div><span class="t">Напоминания</span></div>
      <div class="phone">
        <div class="pnotch"></div>
        <div class="phead"><div class="av"></div><div><div class="t1">Запись в салон</div><div class="t2">бот · онлайн</div></div></div>
        <div class="pbody">
          <div class="pmsg bot">Здравствуйте! Что хотите записать?</div>
          <div class="pbtns"><button>💇 Стрижка</button><button>💅 Маникюр</button></div>
          <div class="pmsg user">Стрижка</div>
          <div class="pmsg bot">Свободное время сегодня:</div>
          <div class="pbtns"><button>11:30</button><button>13:00</button><button>15:45</button></div>
          <div class="pmsg user">15:45</div>
          <div class="pmsg bot">Готово ✅ Записала вас на 15:45</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
