<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="stylesheet" href="avito.css">
<style>
  .h2{font-size:42px; font-weight:700; margin:14px 0 18px;}
  .tag-row{display:flex; gap:10px; margin-bottom:20px;}
  .ctag{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; letter-spacing:.03em; padding:9px 18px; border-radius:999px; background:rgba(74,222,128,0.14); color:var(--green2);}
  .ctag.alt{background:rgba(163,230,53,0.14); color:var(--lime);}
  .shot-frame{flex:1; border-radius:20px; overflow:hidden; border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,0.5); position:relative;}
  .shot-frame img{width:100%; height:100%; object-fit:cover; object-position:top;}
  .shot-url{position:absolute; bottom:20px; left:20px; background:rgba(5,10,6,0.9); backdrop-filter:blur(6px); color:var(--green2); font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; padding:11px 20px; border-radius:12px; border:1px solid var(--line);}
</style></head>
<body>
<div class="slide">
  <div class="blobs"><div class="blob blob1"></div><div class="blob blob2"></div></div>
  <div class="brand"><div class="brand-name"><span class="dot"></span>Дарья Чуручанова</div><div class="pagenum">6/10</div></div>
  <div class="content">
    <div class="tag-row"><span class="ctag">РЕАЛЬНЫЙ ПРОЕКТ</span><span class="ctag alt">САЙТ ДЛЯ ЧАСТНОГО МАСТЕРА</span></div>
    <h2 class="h2">Сайт для тату-студии — портфолио, цены, запись</h2>
    <div class="shot-frame">
      <img src="shot-tattoo.png" alt="">
      <div class="shot-url">dasha-tattoo-tyumen.netlify.app</div>
    </div>
  </div>
</div>
</body></html>
