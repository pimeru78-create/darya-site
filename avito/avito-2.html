<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="stylesheet" href="avito.css">
<style>
  body{width:1080px;height:1080px;}
  .photo-slide{width:1080px; height:1080px; position:relative; overflow:hidden;}
  .photo-slide img{width:100%; height:100%; object-fit:cover; object-position:center 68%;}
  .top-brand{position:absolute; top:28px; left:32px; z-index:3; display:flex; align-items:center; gap:11px; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; text-shadow:0 2px 10px rgba(0,0,0,0.6);}
  .top-brand .dot{width:13px; height:13px; border-radius:50%; background:var(--grad);}
  .top-page{position:absolute; top:24px; right:32px; z-index:3; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; color:#fff; background:rgba(0,0,0,0.5); padding:8px 18px; border-radius:999px;}
  .caption-bar{position:absolute; left:0; right:0; bottom:0; z-index:2; background:linear-gradient(0deg, rgba(0,0,0,0.94), rgba(0,0,0,0.8) 65%, transparent); padding:60px 44px 46px;}
  .caption-bar h1{color:#fff; font-size:58px; font-weight:700; line-height:1.15; letter-spacing:-0.01em;}
  .caption-bar h1 span{color:var(--green2);}
  .caption-sub{color:#dcecdf; font-size:25px; font-weight:700; margin-top:14px; max-width:820px;}
</style></head>
<body>
<div class="photo-slide">
  <img src="photo-sleep.jpg" alt="">
  <div class="top-brand"><span class="dot"></span>Дарья Чуручанова</div>
  <div class="top-page">2/10</div>
  <div class="caption-bar">
    <h1>Чат-бот — <span>работает круглосуточно</span></h1>
    <p class="caption-sub">Отвечает клиентам ночью, в выходные и праздники — пока вы отдыхаете.</p>
  </div>
</div>
</body></html>
